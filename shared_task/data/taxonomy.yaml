version: 2.0
domain: crisis_and_general_events
event_metadata:
  realis:
    description: 'Realis status of the event: how it is presented with respect to reality and time.'
    values:
    - actual
    - generic
    - possible
    - conditional
    - planned
    - pledged
    - forecasted
    - counterfactual
  negated:
    description: Whether the event is negated.
    values:
      - None
      - negated
    
